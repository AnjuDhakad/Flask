<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LibraryHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f4f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .signup-box {
            width: 920px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 45% 55%;
            box-shadow: 0 25px 60px rgba(30, 40, 70, 0.13);
        }

        .info {
            padding: 55px 45px;
            background: #172554;
            color: white;
        }

        .info h1 {
            font-size: 38px;
            margin: 70px 0 18px;
        }

        .info p {
            line-height: 1.8;
            color: #dbe3ff;
        }

        .points {
            margin-top: 35px;
        }

        .point {
            display: flex;
            gap: 12px;
            margin: 18px 0;
            color: #e8ecff;
        }

        .check {
            width: 24px;
            height: 24px;
            background: #6c63ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form {
            padding: 55px;
        }

        .form h2 {
            font-size: 30px;
            color: #172033;
            margin-bottom: 8px;
        }

        .form > p {
            color: #667085;
            margin-bottom: 30px;
        }

        .message {
            padding: 12px;
            background: #fff1f1;
            color: #c0392b;
            border-radius: 8px;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #344054;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d7ddea;
            border-radius: 9px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #6c63ff;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 9px;
            background: #263b80;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #667085;
        }

        .login-link a {
            color: #5965c9;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 750px) {
            .signup-box {
                grid-template-columns: 1fr;
            }

            .info {
                display: none;
            }

            .form {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>

<div class="signup-box">

    <div class="info">
        <h1>Join LibraryHub</h1>

        <p>
            Create your account and start managing
            library activities from a single platform.
        </p>

        <div class="points">
            <div class="point">
                <span class="check">✓</span>
                Easy book management
            </div>

            <div class="point">
                <span class="check">✓</span>
                Track issued books
            </div>

            <div class="point">
                <span class="check">✓</span>
                Organized student records
            </div>
        </div>
    </div>

    <div class="form">
        <h2>Create Account</h2>
        <p>Fill in your details to register.</p>

        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}

        <form method="POST">

            <label>Full Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required>

            <button type="submit">Create My Account</button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>
    </div>

</div>

</body>
</html>
